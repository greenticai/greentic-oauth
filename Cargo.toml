[workspace]
members = [
    "crates/greentic-oauth-core",
    "crates/greentic-oauth-host",
    "crates/greentic-oauth-sdk",
    "components/oidc-ingress",
    "components/oauth-card",
    "components/oidc-provider",
    "components/oidc-provider-runtime",
    "examples/axum-app",
    "apps/oauth-testharness",
    "crates/greentic-oauth-client",
]
resolver = "2"

[workspace.package]
version = "1.2.0-dev.0"
edition = "2024"
repository = "https://github.com/greenticai/greentic-oauth"
homepage = "https://github.com/greenticai/greentic-oauth"
documentation = "https://github.com/greenticai/greentic-oauth/blob/main/README.md"

[workspace.dependencies]
tracing-opentelemetry = "0.32"
ulid = "1"
aes-gcm = "0.10"
anyhow = "1"
async-nats = "0.48"
async-trait = "0.1"
base64 = "0.22"
base64ct = "1"
futures-util = "0.3"
hmac = "0.13"
http-body-util = "0.1"
hyper = "1"
jsonschema = "0"
indexmap = "=2.12.1"
once_cell = "1"
rand = "0.10"
rustls = "0.23"
serde_json = "1"
serde_yaml_bw = "2.5.2"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio-rustls = "0.26"
tracing = "0.1"
webpki-roots = "1"
wiremock = "0.6"
dotenvy = "0.15"
dashmap = "6"
http = "1"
toml = "0.9"
serial_test = "3"
wit-bindgen = "0.57"

[workspace.dependencies.greentic-oauth-core]
path = "crates/greentic-oauth-core"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-oauth-host]
path = "crates/greentic-oauth-host"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-oauth-sdk]
path = "crates/greentic-oauth-sdk"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-telemetry]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-types]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false

[workspace.dependencies.greentic-interfaces-host]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false

[workspace.dependencies.greentic-interfaces-wasmtime]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false

[workspace.dependencies.greentic-interfaces-guest]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false

[workspace.dependencies.greentic-config]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-config-types]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.opentelemetry]
version = "0.31"
features = [
    "metrics",
    "trace",
]

[workspace.dependencies.axum]
version = "0.8"
features = [
    "macros",
    "http1",
    "tokio",
]

[workspace.dependencies.ed25519-dalek]
version = "2"
features = [
    "std",
]

[workspace.dependencies.p256]
version = "0.13"
default-features = false
features = [
    "ecdsa",
]

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "json",
    "rustls",
    "form",
    "query",
]

[workspace.dependencies.schemars]
version = "1"

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.tokio]
version = "1"
default-features = false

[workspace.dependencies.tower]
version = "0.5"
features = [
    "util",
]

[workspace.dependencies.tower-http]
version = "0.6"
features = [
    "trace",
]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = [
    "fmt",
    "env-filter",
]

[workspace.dependencies.ureq]
version = "3"
features = [
    "json",
]

[workspace.dependencies.url]
version = "2"
features = [
    "serde",
]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[workspace.dependencies.wasmtime]
version = "41"
features = [
    "component-model",
]

[workspace.dependencies.clap]
version = "4.5"
features = [
    "derive",
]

[workspace.dependencies.jsonwebtoken]
version = "10"
default-features = false
features = [
    "rust_crypto",
]

[workspace.dependencies.openidconnect]
version = "4.0"
default-features = false
features = [
    "reqwest",
    "rustls-tls",
]

[workspace.dependencies.time]
version = "0.3"
features = [
    "serde",
]

[workspace.dependencies.insta]
version = "1"
features = [
    "json",
]

[workspace.dependencies.chrono]
version = "0.4"
features = [
    "serde",
]
