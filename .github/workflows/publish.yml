name: Publish crates (single or workspace)

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          channel: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint & Test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --exclude greentic-oauth-broker -- -D warnings
          cargo build --workspace --all-features --exclude greentic-oauth-broker
          cargo test --workspace --all-features --exclude greentic-oauth-broker -- --nocapture

  publish:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          channel: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Publish changed crates
        uses: katyo/publish-crates@v2
        with:
          path: .
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
          check-repo: true
          dry-run: true

  publish-oauth-oidc-generic-pack:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          channel: 1.91.0
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Install greentic-pack CLI
        run: |
          if ! command -v greentic-pack >/dev/null 2>&1; then
            cargo install --locked greentic-pack
          fi

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Build OAuth OIDC Generic pack
        run: ./scripts/build-oauth-oidc-generic-pack.sh

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish OAuth OIDC Generic pack to GHCR
        env:
          PACK_REPO: ghcr.io/${{ github.repository_owner }}/oauth-oidc-generic-pack
          PACK_FILE: dist/packs/oauth-oidc-generic.gtpack
        run: |
          oras push "${PACK_REPO}:${GITHUB_SHA}" \
            --artifact-type application/vnd.greentic.gtpack.v1+binary \
            "${PACK_FILE}:application/vnd.greentic.gtpack.layer.v1+binary"

          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            oras tag "${PACK_REPO}:${GITHUB_SHA}" latest
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            oras tag "${PACK_REPO}:${GITHUB_SHA}" "${GITHUB_REF_NAME}"
          fi

      - name: Cleanup pack artifacts
        if: always()
        run: ./scripts/clean-oauth-oidc-generic-pack.sh
