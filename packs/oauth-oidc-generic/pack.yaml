pack_id: oauth-oidc-generic
version: 0.4.31
kind: application
publisher: Greentic
display_name: OAuth (OIDC)
components:
- id: oidc-ingress
  version: 0.4.31
  world: greentic:oidc-ingress/callback@0.1.0
  supports:
  - http
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: false
      clocks: false
    host: {}
  wasm: components/oidc-ingress/component.wasm
- id: oidc-provider-runtime
  version: 0.4.31
  world: greentic:oidc-provider-runtime/oidc-provider-runtime@0.1.0
  supports:
  - http
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: true
      clocks: true
    host: {}
  wasm: components/oidc-provider-runtime/component.wasm
dependencies: []
flows: []
assets:
- path: assets/setup.yaml
extensions:
  greentic.envelope-wrap.v1:
    kind: greentic.envelope-wrap.v1
    version: 0.4.31
    inline:
      enabled: true
  greentic.ext.capabilities.v1:
    kind: greentic.ext.capabilities.v1
    version: 0.4.31
    inline:
      offers:
      - applies_to:
          op_names:
          - oauth.initiate_auth
        cap_id: greentic.cap.oauth.broker.v1
        offer_id: oauth-oidc-generic-exec-initiate-auth-v1
        priority: 100
        provider:
          component_ref: oidc-provider-runtime
          op: authorize-url
        requires_setup: false
        version: 0.4.31
      - applies_to:
          op_names:
          - oauth.get_access_token
        cap_id: greentic.cap.oauth.broker.v1
        offer_id: oauth-oidc-generic-exec-get-access-token-v1
        priority: 110
        provider:
          component_ref: oidc-provider-runtime
          op: exchange-code
        requires_setup: false
        version: 0.4.31
      - applies_to:
          op_names:
          - oauth.request_resource_token
        cap_id: greentic.cap.oauth.broker.v1
        offer_id: oauth-oidc-generic-exec-request-resource-token-v1
        priority: 120
        provider:
          component_ref: oidc-provider-runtime
          op: refresh-token
        requires_setup: false
        version: 0.4.31
      - applies_to:
          op_names:
          - oauth.card.resolve
        cap_id: greentic.cap.oauth.card.v1
        offer_id: oauth-oidc-generic-card-resolve-v1
        priority: 100
        provider:
          component_ref: oidc-provider-runtime
          op: resolve-card
        requires_setup: false
        version: 0.4.31
      schema_version: 1
  greentic.http-routes.v1:
    kind: greentic.http-routes.v1
    version: 0.4.31
    inline:
      routes:
      - domain: oauth
        id: oauth-oidc-callback
        methods:
        - GET
        - POST
        pattern: /v1/oauth/callback/{path*}
        provider_op: ingest_http
      schema_version: 1
  greentic.provider-extension.v1:
    kind: greentic.provider-extension.v1
    version: 0.4.31
    inline:
      providers:
      - provider_type: oauth.oidc.generic.executable
        capabilities:
        - oauth
        - oauth-card
        ops:
        - authorize-url
        - exchange-code
        - refresh-token
        - resolve-card
        - ingest_http
        config_schema_ref: schemas/oauth/oidc/public.config.schema.json
        runtime:
          component_ref: oidc-provider-runtime
          export: schema-core-api
          world: greentic:provider/schema-core@1.0.0
  oauth.provider_flow_hints.v1:
    kind: oauth.provider_flow_hints.v1
    version: 0.4.31
    inline:
      oauth.oidc.generic.executable:
        callback: exchange-code
        default: authorize-url
        refresh: refresh-token
  oauth.provider_ingress.v1:
    kind: oauth.provider_ingress.v1
    version: 0.4.31
    inline:
      capabilities:
        content_types:
        - application/x-www-form-urlencoded
        supports_callback_validation: true
      card_rewrite:
        capability_id: greentic.cap.oauth.card.v1
        marker: oauth://start
        op: oauth.card.resolve
      component_ref: oidc-ingress
      export: handle-callback
      world: greentic:oidc-ingress/callback@0.1.0
