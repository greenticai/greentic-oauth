name: Rust CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/pr-ci.yml@main
    with:
      variant: host
      # Repo uses the wasm canonical toolchain (wasm32-wasip2 target present)
      # but the PR-time CI path builds host code only. Tell pr-ci.yml to
      # check toolchain drift against the wasm canonical variant so the
      # drift check doesn't flag a false positive.
      toolchain-variant: wasm
