name: Rust CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/greentic-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          rust-toolchain: manual
          package: "greentic-oauth-broker,greentic-oauth-client,greentic-oauth-core,greentic-oauth-host,greentic-oauth-sdk"

  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/greentic-target
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          channel: 1.91.0
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Ensure clean workspace artifacts
        run: |
          rm -rf target
          mkdir -p "$CARGO_TARGET_DIR"

      - name: Cargo fetch
        run: cargo fetch

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-features --exclude greentic-oauth-broker -- -D warnings

      - name: Cargo build
        run: cargo build --workspace --all-features --exclude greentic-oauth-broker

      - name: Cargo test
        run: cargo test --workspace --all-features --exclude greentic-oauth-broker

      - name: Install greentic-pack CLI (for pack build)
        run: |
          if ! command -v greentic-pack >/dev/null 2>&1; then
            cargo install --locked greentic-pack
          fi

      - name: Build OAuth OIDC Generic pack
        run: ./scripts/build-oauth-oidc-generic-pack.sh

      - name: Cleanup build artifacts
        if: always()
        run: |
          rm -rf "$CARGO_TARGET_DIR"
          rm -rf target
          ./scripts/clean-oauth-oidc-generic-pack.sh
